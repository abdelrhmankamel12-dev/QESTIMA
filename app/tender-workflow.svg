<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 410" role="img" aria-labelledby="title desc">
  <title id="title">QESTIMA Tender Workflow</title>
  <desc id="desc">Standard tender workflow with a quick pricing branch that keeps review warnings visible.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1"><stop stop-color="#f7faf9"/><stop offset="1" stop-color="#edf5f3"/></linearGradient>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9z" fill="#6d858a"/></marker>
    <style>
      .box{fill:#fff;stroke:#cbd9da;stroke-width:2}.primary{fill:#e5f5f2;stroke:#0d7f7b}.warn{fill:#fff5df;stroke:#d59523}.final{fill:#102a33;stroke:#102a33}.title{font:700 18px Arial;fill:#17333a}.sub{font:13px Arial;fill:#60777c}.light{fill:#fff}.line{fill:none;stroke:#6d858a;stroke-width:2.2;marker-end:url(#arrow)}.dash{stroke-dasharray:7 6}.tag{font:700 12px Arial;fill:#9a6200}.num{font:700 15px Arial;fill:#0d7f7b}
    </style>
  </defs>
  <rect width="1280" height="410" rx="20" fill="url(#bg)"/>
  <text x="1215" y="42" text-anchor="end" class="title">QESTIMA — دورة استقبال ومراجعة وتسعير المناقصة</text>
  <rect class="box primary" x="1045" y="80" width="190" height="86" rx="15"/><text class="num" x="1210" y="106" text-anchor="end">01</text><text class="title" x="1210" y="132" text-anchor="end">إنشاء المشروع</text><text class="sub" x="1210" y="153" text-anchor="end">البيانات + نمط العمل</text>
  <rect class="box" x="785" y="80" width="210" height="86" rx="15"/><text class="num" x="970" y="106" text-anchor="end">02</text><text class="title" x="970" y="132" text-anchor="end">Tender Documents</text><text class="sub" x="970" y="153" text-anchor="end">رفع · تصنيف · Register</text>
  <rect class="box" x="525" y="80" width="210" height="86" rx="15"/><text class="num" x="710" y="106" text-anchor="end">03</text><text class="title" x="710" y="132" text-anchor="end">Tender Review</text><text class="sub" x="710" y="153" text-anchor="end">شروط + مصادر + نطاق</text>
  <rect class="box" x="265" y="80" width="210" height="86" rx="15"/><text class="num" x="450" y="106" text-anchor="end">04</text><text class="title" x="450" y="132" text-anchor="end">BOQ &amp; Takeoff</text><text class="sub" x="450" y="153" text-anchor="end">تنظيف + ربط + فروق</text>
  <rect class="box primary" x="25" y="80" width="190" height="86" rx="15"/><text class="num" x="190" y="106" text-anchor="end">05</text><text class="title" x="190" y="132" text-anchor="end">Pricing</text><text class="sub" x="190" y="153" text-anchor="end">تحليل + RFQ + Markup</text>
  <path class="line" d="M1045 123H1000"/><path class="line" d="M785 123H740"/><path class="line" d="M525 123H480"/><path class="line" d="M265 123H220"/>
  <rect class="box warn" x="795" y="245" width="270" height="94" rx="15"/><text class="tag" x="1040" y="273" text-anchor="end">QUICK PRICING MODE</text><text class="title" x="1040" y="301" text-anchor="end">بدء BOQ مباشرة</text><text class="sub" x="1040" y="324" text-anchor="end">Tender Review Incomplete يظل ظاهرًا</text>
  <path class="line dash" d="M1140 166V215H930V240"/>
  <path class="line dash" d="M795 292H370V171"/>
  <rect class="box final" x="210" y="265" width="250" height="86" rx="15"/><text class="title light" x="435" y="297" text-anchor="end">Final Review &amp; Reports</text><text class="sub light" x="435" y="322" text-anchor="end">مخاطر · Clarifications · Revision</text>
  <path class="line" d="M120 166V220H205V265"/>
  <text x="35" y="390" class="sub">AI suggestions require engineer approval · كل معلومة لها مصدر مستند وصفحة</text>
</svg>
