<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 210" role="img" aria-labelledby="title desc">
  <title id="title">QESTIMA pricing workflow</title>
  <desc id="desc">Five linked stages from tender setup to final quotation</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1d26"/><stop offset="1" stop-color="#123944"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#14a79d"/><stop offset="1" stop-color="#0d7f7b"/></linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%"><feDropShadow dx="0" dy="7" stdDeviation="7" flood-opacity=".18"/></filter>
  </defs>
  <rect width="1120" height="210" rx="20" fill="url(#bg)"/>
  <path d="M115 105H1005" stroke="#56717a" stroke-width="3" stroke-dasharray="7 9"/>
  <g fill="#f0b64d">
    <path d="M316 105l-13-8v16z"/><path d="M527 105l-13-8v16z"/><path d="M738 105l-13-8v16z"/><path d="M949 105l-13-8v16z"/>
  </g>
  <g font-family="Segoe UI,Tahoma,Arial,sans-serif" text-anchor="middle" filter="url(#shadow)">
    <g transform="translate(105 105)"><rect x="-84" y="-61" width="168" height="122" rx="16" fill="#fff"/><circle cy="-24" r="19" fill="url(#accent)"/><text y="-18" font-size="18" font-weight="800" fill="#fff">1</text><text y="14" font-size="15" font-weight="800" fill="#10272f">Project Setup</text><text y="38" font-size="12" fill="#657981">المشروع والمناقصة</text></g>
    <g transform="translate(316 105)"><rect x="-84" y="-61" width="168" height="122" rx="16" fill="#fff"/><circle cy="-24" r="19" fill="url(#accent)"/><text y="-18" font-size="18" font-weight="800" fill="#fff">2</text><text y="14" font-size="15" font-weight="800" fill="#10272f">BOQ Clean &amp; Map</text><text y="38" font-size="12" fill="#657981">تنظيف وربط البنود</text></g>
    <g transform="translate(527 105)"><rect x="-84" y="-61" width="168" height="122" rx="16" fill="#fff"/><circle cy="-24" r="19" fill="url(#accent)"/><text y="-18" font-size="18" font-weight="800" fill="#fff">3</text><text y="14" font-size="15" font-weight="800" fill="#10272f">Rates, RFQ &amp; Quotes</text><text y="38" font-size="12" fill="#657981">التحليل والعروض</text></g>
    <g transform="translate(738 105)"><rect x="-84" y="-61" width="168" height="122" rx="16" fill="#fff"/><circle cy="-24" r="19" fill="url(#accent)"/><text y="-18" font-size="18" font-weight="800" fill="#fff">4</text><text y="14" font-size="15" font-weight="800" fill="#10272f">Markup &amp; Review</text><text y="38" font-size="12" fill="#657981">الربح والمراجعة</text></g>
    <g transform="translate(949 105)"><rect x="-84" y="-61" width="168" height="122" rx="16" fill="#fff"/><circle cy="-24" r="19" fill="#f0b64d"/><text y="-18" font-size="18" font-weight="800" fill="#0b1d26">5</text><text y="14" font-size="15" font-weight="800" fill="#10272f">Final Quotation</text><text y="38" font-size="12" fill="#657981">العرض والتقارير</text></g>
  </g>
  <text x="1090" y="194" text-anchor="end" font-family="Segoe UI,Tahoma,Arial,sans-serif" font-size="10" fill="#91a7ad">Supplier price → Resource → Unit rate → Section → Project</text>
</svg>
