name: Windows build and startup test
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Install build dependencies
        shell: pwsh
        run: |
          npm install --no-save --package-lock=false electron@37.2.6 playwright@1.51.1
          if ($LASTEXITCODE -ne 0) { throw 'Dependency installation failed' }
          choco install nsis --version=3.11 -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'NSIS installation failed' }
          npx playwright install chromium
          if ($LASTEXITCODE -ne 0) { throw 'Chromium installation failed' }
      - name: Unit and browser interaction tests
        shell: pwsh
        run: |
          node --test tests/*.test.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Unit tests failed' }
          node tests/browser-interaction.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Browser interaction tests failed' }
      - name: Build and test installed Windows application
        shell: pwsh
        run: ./build/windows-build-test.ps1
      - name: Save test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: QESTIMA-Windows-test-evidence
          path: artifacts/
          retention-days: 7
          if-no-files-found: warn
      - name: Save preview installer only after tests pass
        uses: actions/upload-artifact@v4
        with:
          name: QESTIMA-Windows-Preview-Unsigned
          path: release/*
          retention-days: 7
          if-no-files-found: error
